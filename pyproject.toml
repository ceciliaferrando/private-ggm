[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "privateggm"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "networkx",
    "jax",
    "optax",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["privateggm*", "experiments*"]
